<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capybar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="assets/misc/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="assets/misc/icon-192.png">
<link rel="stylesheet" href="css/style.css?v=10">
</head>
<body>
<!--SYMBOLS-->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="capy" viewBox="0 0 100 100">
<ellipse cx="32" cy="98" rx="42" ry="29" fill="#9a6536"/>
<path d="M18 44Q18 20 42 20H66Q93 21 95 47V64Q95 82 78 82H38Q18 82 18 60Z" fill="#bd8049" stroke="#5b3418" stroke-width="2.4" stroke-linejoin="round"/>
<ellipse cx="50" cy="30" rx="22" ry="5.5" fill="#d6a269" opacity=".55"/>
<path d="M72 44Q94 44 94 56V64Q94 80 78 81H70Q75 62 72 44Z" fill="#9a6538"/>
<ellipse cx="40" cy="24" rx="7.5" ry="6" fill="#7d4f28" stroke="#5b3418" stroke-width="1.6"/><ellipse cx="40.5" cy="25" rx="3.6" ry="3" fill="#4d2e16"/>
<rect x="83" y="36" width="13" height="22" rx="6.5" fill="#2f180b"/>
<ellipse cx="90.5" cy="44" rx="1.9" ry="2.8" fill="#8a5a38"/>
<path d="M94 67Q85 74 75 69" stroke="#2f180b" stroke-width="2.3" fill="none" stroke-linecap="round"/>
<ellipse cx="60" cy="41" rx="3.7" ry="4.3" fill="#1f1006"/><circle cx="61.3" cy="39.4" r="1.4" fill="#fff"/>
<path d="M53 35.5q6-4.5 13-1" stroke="#5b3418" stroke-width="2" fill="none" stroke-linecap="round"/>
<ellipse cx="67" cy="58" rx="5" ry="3" fill="#e08a6a" opacity=".5"/></symbol>
</svg>
<!--/SYMBOLS-->

<div id="menu" class="screen">
  <div id="menu-fan"></div>
  <div class="menu-card">
    <img class="logo-img" src="assets/misc/logo.webp" alt="Capybar" width="640" height="640">
    <p class="tag">The card game of the coziest bar in town</p>
    <div class="orn"><i></i></div>
    <input class="name-in" id="name-in" maxlength="12" value="Player" aria-label="Your name">
    <div class="opp-pick"><span>Rivals</span>
      <button class="chip" data-bots="1">1</button><button class="chip on" data-bots="2">2</button><button class="chip" data-bots="3">3</button>
    </div>
    <div class="menu-btns">
      <button class="btn big" id="btn-play">Play</button>
      <button class="btn big alt" id="btn-tutorial">Tutorial</button>
      <button class="btn big online" id="btn-online">Play online</button>
      <button class="btn ghost" id="btn-rules">Rules &amp; cards</button>
    </div>
  </div>
</div>

<div id="game" class="screen hidden">
  <header id="topbar"></header>
  <section id="opps"></section>
  <section id="center"></section>
  <div id="banner"></div>
  <section id="me"></section>
  <aside id="log" class="hidden"></aside>
  <div id="played"></div>
</div>

<div id="zoom"></div>
<div id="modal" class="hidden"></div>
<div id="tut" class="hidden"><div id="tut-block"></div><div id="tut-spot"></div><div id="tut-bubble"></div></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/art.js?v=10"></script>
<script src="js/data.js?v=10"></script>
<script src="js/engine.js?v=10"></script>
<script src="js/bots.js?v=10"></script>
<script src="js/ui.js?v=10"></script>
<script src="js/net.js?v=10"></script>
<script src="js/tutorial.js?v=10"></script>
<script src="js/main.js?v=10"></script>
</body>
</html>
